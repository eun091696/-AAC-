# main에 서버 코드가 합쳐지면: 테스트 → 컨테이너 빌드 → AWS Lightsail 배포
name: Deploy server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2   # 서울
  SERVICE: koktok-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 서버 테스트
        working-directory: server
        run: npm test

      - name: AWS 로그인
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Lightsail 업로드 도구 설치
        run: |
          sudo curl -fsSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: 컨테이너 빌드
        run: docker build -t koktok-api:${{ github.sha }} server

      - name: 이미지 업로드
        id: push
        run: |
          OUT=$(aws lightsail push-container-image --service-name "$SERVICE" --label api --image "koktok-api:${{ github.sha }}")
          echo "$OUT"
          IMAGE=$(echo "$OUT" | grep -o ':koktok-api\.api\.[0-9]*' | tail -1)
          test -n "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: 배포
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          jq -n --arg img "$IMAGE" --arg key "$OPENAI_API_KEY" '{api: {image: $img, ports: {"8080": "HTTP"}, environment: {OPENAI_API_KEY: $key, OPENAI_MODEL: "gpt-image-1-mini", OPENAI_IMAGE_QUALITY: "medium", PROMPT_VERSION: "v3-pictogram"}}}' > containers.json
          echo '{"containerName":"api","containerPort":8080,"healthCheck":{"path":"/health","intervalSeconds":30}}' > endpoint.json
          aws lightsail create-container-service-deployment --service-name "$SERVICE" \
            --containers file://containers.json --public-endpoint file://endpoint.json > /dev/null
          rm containers.json

      - name: 배포 완료 대기 후 상태 확인
        run: |
          for i in $(seq 1 40); do
            STATE=$(aws lightsail get-container-services --service-name "$SERVICE" --query 'containerServices[0].state' --output text)
            echo "상태: $STATE"
            [ "$STATE" = "RUNNING" ] && break
            sleep 15
          done
          URL=$(aws lightsail get-container-services --service-name "$SERVICE" --query 'containerServices[0].url' --output text)
          curl -fsS "${URL}health"
