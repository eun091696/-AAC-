# PR과 main 푸시마다 앱/서버 검사를 자동으로 실행
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소 (실행 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: 앱 검사 (린트 + 타입 + 로직)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 린트 (ESLint)
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 로직 테스트
        run: npm run check:logic
      - name: 심볼 카탈로그 테스트
        run: npm run check:symbols
      - name: 그림 뜻 검사
        run: npm run check:meaning
      - name: 그림 라이브러리 검사
        run: npm run check:library

  server:
    name: 서버 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 단위 테스트
        run: npm test
